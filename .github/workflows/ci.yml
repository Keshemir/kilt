name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Syntax
        run: python3 -I -m py_compile kilt.py tests/security.py tests/translations.py tests/unit.py
      - name: Every Russian menu text has an English version
        run: python3 tests/translations.py
      - name: File rights, key checks and project names (no root)
        run: python3 tests/unit.py

  attack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        lang: [en, ru]
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y openssh-server nftables acl cron
      - name: Attack tests
        run: sudo KILT_TEST_LANG=${{ matrix.lang }} python3 tests/security.py
